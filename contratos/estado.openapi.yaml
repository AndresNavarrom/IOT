openapi: 3.0.3

info:
  title: IoT.Estado - Servicio de Estado de Dispositivos
  version: 1.0.0
  description: |
    Servicio (S4) que mantiene el estado vigente y el histórico de
    transiciones de cada dispositivo IoT.

    Reemplaza el patrón State (`Patterns/State/*`, `Device.handleStatus`)
    del monolito. Modelado como event sourcing: cada transición es un
    evento append-only.

    Tipo SOA (Erl): Entity Service ligero.
    Suscrito a:
      - dispositivo.ciclo-vida.creado (S2)  -> inicializa en `fuera-de-linea`
      - dispositivo.control.* (S3)          -> autotransiciones
  contact:
    name: Equipo IoT

servers:
  - url: http://localhost:5004
    description: Desarrollo local

tags:
  - name: estado
    description: Estado y transiciones de dispositivos

paths:

  /dispositivos/{id}/estado:
    get:
      tags: [estado]
      summary: Obtener el estado actual del dispositivo
      operationId: obtenerEstadoActual
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DispositivoId' } ]
      responses:
        '200':
          description: Estado actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoActual' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /dispositivos/{id}/estado/transiciones:
    get:
      tags: [estado]
      summary: Listar el histórico de transiciones (event sourcing)
      operationId: listarTransiciones
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/DispositivoId'
        - name: desde
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Histórico de transiciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transicion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    post:
      tags: [estado]
      summary: Registrar manualmente una transición (uso administrativo)
      operationId: registrarTransicion
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/DispositivoId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudTransicion' }
      responses:
        '201':
          description: Transición registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transicion' }
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Transición no válida desde el estado actual
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DispositivoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NoAutenticado:
      description: Token ausente o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: Dispositivo no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ErrorValidacion:
      description: Datos de entrada inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }

  schemas:

    EstadoDispositivo:
      type: string
      enum: [en-linea, fuera-de-linea, error]
      description: |
        - `en-linea`: equivale a `OnlineStatus`
        - `fuera-de-linea`: equivale a `OfflineStatus`
        - `error`: equivale a `ErrorStatus`

    EstadoActual:
      type: object
      required: [dispositivoId, estado, desde]
      properties:
        dispositivoId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoDispositivo' }
        desde:
          type: string
          format: date-time
          description: Momento en que el dispositivo entró en este estado

    Transicion:
      type: object
      required: [id, dispositivoId, desde, hacia, ocurridoEn]
      properties:
        id: { type: string, format: uuid }
        dispositivoId: { type: string, format: uuid }
        desde: { $ref: '#/components/schemas/EstadoDispositivo' }
        hacia: { $ref: '#/components/schemas/EstadoDispositivo' }
        razon:
          type: string
          description: Motivo (p. ej. "comando-encender", "ping-fallido")
        ocurridoEn:
          type: string
          format: date-time

    SolicitudTransicion:
      type: object
      required: [hacia]
      properties:
        hacia: { $ref: '#/components/schemas/EstadoDispositivo' }
        razon: { type: string }

    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }

    ProblemaValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            errores:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
